name: Evri
kind: company
description: >-
  Evri is the United Kingdom's largest dedicated parcel delivery company, formerly
  Hermes UK, headquartered in Leeds and majority owned by Apollo-managed funds.
  Following the CMA-cleared 2025 merger with DHL eCommerce UK, the combined group
  delivers more than a billion parcels a year across a courier network of 30,000+
  couriers and van drivers, thousands of ParcelShops and lockers, and domestic,
  returns and international services for retailers and marketplace sellers. Evri
  sits at the last-mile end of the supply chain — the carrier a shipper, retailer
  or e-commerce platform hands a parcel to for final delivery in the UK. Its API
  posture is customer-contract portal only: Evri publishes no developer portal, no
  public API reference and no machine-readable specification. The host api.evri.com
  resolves to a live Tyk API Gateway (5.13.0) whose only publicly reachable path is
  an unauthenticated health check; every other probed path returns 404 and no listen
  path is discoverable without credentials. Shipment, label, ParcelShop, Print in
  Store and tracking credentials are issued by an Evri account manager or sales
  representative to contracted Corporate or Business accounts, with sandbox and
  production credentials handed over by email. In practice most integrators reach
  Evri indirectly through shipping-API aggregators such as EasyPost, ShipEngine /
  ShipStation, Sendcloud, AfterShip and Intersoft Sapient rather than directly.

actions:
  apisListed: 0
  apisYmlCreated: true
  openapiHarvested: false
  specsCount: 0
  status: built-stub
  reason: >-
    Identity captured and the API posture documented with probe evidence, but apis[]
    is deliberately empty. Evri's APIs are real and in production behind a Tyk
    gateway, yet not one of them has a first-party human-readable documentation URL,
    a published base URL, or a machine-readable contract. Listing them from
    third-party aggregator descriptions would fabricate a public surface that does
    not exist. The API family is instead recorded in findings.apiFamilyObserved with
    the aggregator evidence that establishes it.
